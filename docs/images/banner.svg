<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="retBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="retAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <pattern id="retGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="retGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#retBgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#retGrid)" />

  <!-- Ambient Glow -->
  <circle cx="1020" cy="110" r="160" fill="#6366F1" opacity="0.16" filter="url(#retGlow)" />
  <circle cx="200" cy="280" r="140" fill="#8B5CF6" opacity="0.12" filter="url(#retGlow)" />

  <!-- Status Badge -->
  <g transform="translate(80, 52)">
    <rect width="280" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#6366F1" />
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#C7D2FE" letter-spacing="1.2">ENTERPRISE GOF PATTERNS &amp; CLEAN ARCH</text>
  </g>

  <!-- Title & Narrative -->
  <g transform="translate(80, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Devoluciones &amp; Garantías <tspan fill="url(#retAccentGrad)">Backend</tspan>
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#E0E7FF" letter-spacing="0.2">
      Motor de Gestión de Devoluciones y Garantías E-Commerce con Patrones de Diseño
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#818CF8">
      ASP.NET Core 8 Web API · EF Core · Supabase Postgres &amp; Storage · Strategy · State · Observer
    </text>
  </g>

  <!-- Key Metrics Row -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#818CF8" text-transform="uppercase">FRAMEWORK</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#FFFFFF">.NET 8 Web API</text>

    <rect x="200" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#818CF8" text-transform="uppercase">CLOUD STORAGE</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#38BDF8">Supabase Buckets</text>

    <rect x="400" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#818CF8" text-transform="uppercase">PATRONES GOF</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#34D399">5 Design Patterns</text>
  </g>

  <!-- Right Visual: Returns & Warranty Shield -->
  <g transform="translate(910, 75)">
    <rect x="0" y="0" width="220" height="190" rx="14" fill="rgba(30, 27, 75, 0.85)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5" />
    
    <!-- Circular Flow Arrows -->
    <circle cx="110" cy="80" r="42" fill="none" stroke="rgba(129, 140, 248, 0.25)" stroke-width="6" stroke-dasharray="16, 8" />
    <path d="M 110 50 L 125 65 L 110 80" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 110 110 L 95 95 L 110 80" fill="none" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Subtext bar -->
    <rect x="25" y="148" width="170" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <text x="110" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10.5" font-weight="700" fill="#C7D2FE" text-anchor="middle">Hexagonal Architecture</text>
  </g>
</svg>